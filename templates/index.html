<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conversation App</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 2rem; }
      .card { max-width: 720px; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; }
      .row { display: flex; gap: 8px; margin-bottom: 8px; }
      input, select, button, textarea { padding: 8px; font-size: 14px; }
      textarea { width: 100%; height: 100px; }
      .messages { margin-top: 12px; background: #fafafa; border: 1px solid #eee; border-radius: 8px; padding: 12px; min-height: 80px; white-space: pre-wrap; }
      label { font-size: 12px; color: #555; }
    </style>
  </head>
  <body>
    <h1>Conversation App</h1>
    <div class="card">
      <div class="row">
        <div style="flex:1">
          <label>API Token</label>
          <input id="token" type="password" placeholder="paste token" />
        </div>
      </div>
      <div class="row">
        <div style="flex:1">
          <label>Chat ID</label>
          <input id="chatId" type="number" placeholder="existing chat id" />
        </div>
      </div>
      <div class="row">
        <div style="flex:1">
          <label>Message</label>
          <textarea id="message" placeholder="Type your message…"></textarea>
        </div>
      </div>
      <div class="row">
        <button id="sendBtn">Send</button>
        <button id="startBtn">Start Chat</button>
      </div>
      <div class="messages" id="output"></div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const API_BASE = '';

      async function startChat() {
        const token = $('token').value.trim();
        if (!token) return write('Please provide API token.');
        // Minimal payload placeholder; adjust IDs as needed
        // You likely need real IDs from your DB for theme, scenario, language_level
        const payload = { theme: 1, scenario: 1, language_level: 1 };
        const res = await fetch(API_BASE + '/chat/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/vnd.api+json',
            'Accept': 'application/vnd.api+json',
            'Authorization': 'Token ' + token
          },
          body: JSON.stringify(payload)
        });
        const text = await res.text();
        try {
          const data = JSON.parse(text);
          if (res.ok && data && data.id) {
            $('chatId').value = data.id;
            write('Chat created. ID: ' + data.id);
          } else {
            write('Failed to create chat: ' + text);
          }
        } catch(e) {
          write('Unexpected response: ' + text);
        }
      }

      async function sendMessage() {
        const token = $('token').value.trim();
        const chatId = $('chatId').value.trim();
        const message = $('message').value;
        if (!token) return write('Please provide API token.');
        if (!chatId) return write('Please set Chat ID or click Start Chat.');

        const payload = message
          ? { chat_id: Number(chatId), message: message }
          : { chat_id: Number(chatId) };

        const res = await fetch(API_BASE + '/chat_message/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/vnd.api+json',
            'Accept': 'application/vnd.api+json',
            'Authorization': 'Token ' + token
          },
          body: JSON.stringify(payload)
        });
        const text = await res.text();
        if (res.ok) {
          write('Bot: ' + text);
          $('message').value = '';
        } else {
          write('Error: ' + text);
        }
      }

      function write(msg) {
        const out = $('output');
        out.textContent = (out.textContent ? out.textContent + '\n' : '') + msg;
      }

      $('sendBtn').addEventListener('click', sendMessage);
      $('startBtn').addEventListener('click', startChat);
    </script>
  </body>
  </html>
